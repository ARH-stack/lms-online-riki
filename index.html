<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Belajar — Bersama kak Riki</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8F6FF;--ink:#3C3C3C;--g:#58CC02;--gs:#46A302;--b:#1CB0F6;--bs:#1899D6;--y:#FFC800;--ys:#E5AC00;--r:#FF4B4B;--rs:#D93A3A;--p:#CE82FF;--ps:#A568CC;--edge:#CFE3F1}
*{-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;font-weight:700;background:var(--bg);color:var(--ink)}
h1,h2,h3,.fd{font-family:'Baloo 2',sans-serif;font-weight:800;line-height:1.15}
[x-cloak]{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #1CB0F666;outline-offset:2px}

/* ---- clay surfaces ---- */
.clay{background:#fff;border-radius:30px;box-shadow:inset 0 8px 12px rgba(255,255,255,.95),inset 0 -8px 0 rgba(60,120,170,.07),0 8px 0 var(--edge),0 22px 30px rgba(60,120,170,.18)}
.clay-sm{border-radius:22px;box-shadow:inset 0 5px 8px rgba(255,255,255,.95),inset 0 -5px 0 rgba(60,120,170,.07),0 5px 0 var(--edge),0 12px 18px rgba(60,120,170,.14);background:#fff}
.btn{--c:var(--g);--s:var(--gs);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;color:#fff;background:var(--c);border-radius:20px;padding:11px 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
 box-shadow:inset 0 6px 8px rgba(255,255,255,.38),inset 0 -6px 0 rgba(0,0,0,.09),0 6px 0 var(--s),0 14px 18px rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:translateY(5px);box-shadow:inset 0 6px 8px rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.09),0 1px 0 var(--s),0 3px 6px rgba(0,0,0,.14)}
.btn:disabled{--c:#DDE6EC;--s:#C3CFD8;color:#9AA9B4;cursor:not-allowed;transform:none;filter:none}
.btn-blue{--c:var(--b);--s:var(--bs)}.btn-red{--c:var(--r);--s:var(--rs)}.btn-purple{--c:var(--p);--s:var(--ps)}
.btn-yellow{--c:var(--y);--s:var(--ys);color:#6B4E00}.btn-ghost{--c:#fff;--s:var(--edge);color:#6B7C88}
.btn-sm{font-size:.9rem;padding:7px 14px;border-radius:16px}.btn-lg{font-size:1.25rem;padding:15px 28px;width:100%;border-radius:24px}
.inp{width:100%;background:#F0F8FD;border:3px solid transparent;border-radius:18px;padding:12px 16px;font-weight:800;font-size:.95rem;box-shadow:inset 0 4px 8px rgba(60,120,170,.2);transition:border-color .15s,background .15s}
.inp:focus{border-color:var(--b);background:#fff;outline:0}
.lbl{display:block;font-size:.85rem;margin:0 0 6px 6px;color:#6B7C88}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;box-shadow:inset 0 3px 5px #fff,inset 0 -3px 0 rgba(60,120,170,.08),0 3px 0 var(--edge)}
.tab{padding:9px 18px;border-radius:999px;background:#fff;color:#6B7C88;font-weight:900;white-space:nowrap;box-shadow:inset 0 3px 5px #fff,0 4px 0 var(--edge);transition:transform .12s}
.tab:active{transform:translateY(3px)}.tab.on{background:var(--b);color:#fff;box-shadow:inset 0 4px 6px rgba(255,255,255,.4),0 4px 0 var(--bs)}
.tbl{width:100%;font-size:.9rem;text-align:left;border-collapse:collapse}.tbl th{padding:12px 16px;color:#8A9AA6;font-weight:900;background:#F4FAFE}.tbl td{padding:12px 16px;border-top:2px solid #EEF5FA}
.tbl tr:hover td{background:#FAFDFF}
.drop{border:4px dashed #BFD8EA;border-radius:24px;background:#F6FBFF;padding:22px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}.drop:hover{border-color:var(--b);transform:scale(1.01)}

/* ---- learning path ---- */
.node{width:92px;height:92px;border-radius:50%;font-size:2.4rem;display:grid;place-items:center;position:relative;cursor:pointer;color:#fff;
 background:var(--c);box-shadow:inset 0 10px 12px rgba(255,255,255,.4),inset 0 -10px 0 rgba(0,0,0,.1),0 10px 0 var(--s),0 20px 24px rgba(0,0,0,.16);transition:transform .15s,box-shadow .15s}
.node:hover{transform:translateY(-4px) rotate(-4deg) scale(1.05)}.node:active{transform:translateY(8px);box-shadow:inset 0 10px 12px rgba(255,255,255,.3),inset 0 -6px 0 rgba(0,0,0,.1),0 2px 0 var(--s)}
.n-orange{--c:#FF9600;--s:#D97E00}.n-green{--c:var(--g);--s:var(--gs)}.n-blue{--c:var(--b);--s:var(--bs)}.n-purple{--c:var(--p);--s:var(--ps)}
.node.is-done{--c:var(--y);--s:var(--ys)}
.tick{position:absolute;right:-6px;top:-6px;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--g);font-size:1.1rem;display:grid;place-items:center;box-shadow:0 3px 0 var(--edge),0 6px 10px rgba(0,0,0,.15);animation:pop .4s}
.start{position:absolute;left:50%;top:-52px;transform:translateX(-50%);background:#fff;color:var(--g);font-family:'Baloo 2';font-weight:800;padding:6px 16px;border-radius:16px;box-shadow:0 4px 0 var(--edge),0 8px 12px rgba(0,0,0,.12);animation:hop 1.1s ease-in-out infinite;white-space:nowrap}
.start:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}

/* ---- quiz ---- */
.bar{height:20px;border-radius:99px;background:#D7E7F2;box-shadow:inset 0 4px 6px rgba(60,120,170,.25);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--g);box-shadow:inset 0 5px 0 rgba(255,255,255,.35);transition:width .6s cubic-bezier(.3,1.4,.5,1);position:relative}
.opt{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 18px;border-radius:22px;background:#fff;cursor:pointer;font-size:1.05rem;font-weight:800;
 border:3px solid #E3EEF6;box-shadow:inset 0 5px 8px #fff,inset 0 -5px 0 rgba(60,120,170,.06),0 6px 0 var(--edge);animation:rise .45s cubic-bezier(.3,1.5,.5,1) backwards;transition:transform .12s,box-shadow .12s}
.opt:hover:not(:disabled){transform:translateY(-2px)}.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.opt .k{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#EAF3F9;font-family:'Baloo 2';font-size:1.1rem;color:#6B7C88;flex:none}
.opt.sel{border-color:var(--b);background:#E3F5FF;box-shadow:0 6px 0 var(--bs)}.opt.sel .k{background:var(--b);color:#fff}
.opt.right{border-color:var(--g);background:#E6FAD3;box-shadow:0 6px 0 var(--gs);animation:pulse .5s}.opt.right .k{background:var(--g);color:#fff}
.opt.wrong{border-color:var(--r);background:#FFE3E3;box-shadow:0 6px 0 var(--rs);animation:shake .45s}.opt.wrong .k{background:var(--r);color:#fff}
.opt.dim{opacity:.55}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;border-top:4px solid transparent;transition:background .25s,border-color .25s}
.sheet.idle{background:#fff;border-color:#E3EEF6}.sheet.ok{background:#DFF8C6;border-color:#B8EC8C;color:#3B8A00}.sheet.no{background:#FFDCDC;border-color:#FFB8B8;color:#C73333}
.star{font-size:4rem;filter:grayscale(1) opacity(.3);transform:scale(.6)}.star.on{filter:none;animation:pop .6s cubic-bezier(.3,1.8,.5,1) forwards;animation-delay:var(--d)}

/* ---- mascot & decor ---- */
.mascot{animation:bob 3.2s ease-in-out infinite;overflow:visible}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.m-sad{display:none}.sad .m-sad{display:block}.sad .m-happy{display:none}.sad .mascot{animation:none}
.happy-jump .mascot{animation:hop .7s ease-in-out infinite}
.blob{position:absolute;border-radius:50%;animation:float 9s ease-in-out infinite;box-shadow:inset -14px -14px 24px rgba(0,0,0,.08),inset 12px 12px 22px rgba(255,255,255,.6)}
.cf{position:fixed;top:45vh;width:10px;height:15px;border-radius:3px;z-index:100;pointer-events:none;animation:cf 1.6s cubic-bezier(.2,.7,.4,1) forwards}
.dots i{width:14px;height:14px;border-radius:50%;display:inline-block;margin:0 3px;animation:hop .8s infinite}.dots i:nth-child(2){animation-delay:.12s}.dots i:nth-child(3){animation-delay:.24s}
.pop{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}.bump{animation:pulse .5s}.slide-up{animation:slideup .35s cubic-bezier(.3,1.4,.5,1)}.shake{animation:shake .45s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-22px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.08)}}
@keyframes rise{from{transform:translateY(24px) scale(.95);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes slideup{from{transform:translateY(60px);opacity:0}}
@keyframes cf{30%{transform:translate(calc(var(--dx)*.5),-22vh) rotate(calc(var(--r)*.4))}100%{transform:translate(var(--dx),50vh) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body x-data="bimbelApp()" x-init="initApp()" class="min-h-screen">

<!-- Toast -->
<div x-show="toast.show" x-cloak x-transition.opacity class="fixed top-20 left-1/2 -translate-x-1/2 z-[90] w-[90%] max-w-sm">
  <div class="clay-sm pop px-5 py-3 flex items-center gap-3 text-sm"><span class="text-xl">🎈</span><span x-text="toast.message"></span></div>
</div>

<!-- Loading -->
<div x-show="loading" x-cloak class="fixed inset-0 z-[80] bg-sky-100/70 backdrop-blur-sm flex items-center justify-center">
  <div class="clay pop px-8 py-6 text-center"><div class="dots"><i style="background:var(--g)"></i><i style="background:var(--b)"></i><i style="background:var(--y)"></i></div><p class="mt-3 text-sm">Sebentar ya, lagi memuat...</p></div>
</div>

<!-- ============ 1. LOGIN ============ -->
<template x-if="!session.loggedIn">
<div class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
  <i class="blob" style="width:190px;height:190px;left:-50px;top:8%;background:var(--y)"></i>
  <i class="blob" style="width:260px;height:260px;right:-80px;bottom:-40px;background:var(--b);animation-delay:-3s"></i>
  <i class="blob" style="width:110px;height:110px;right:12%;top:10%;background:var(--p);animation-delay:-6s"></i>
  <div class="clay max-w-md w-full p-8 pt-6 relative text-center pop">
    <div class="w-36 mx-auto" :class="loginError ? 'sad shake' : ''" x-html="mascot"></div>
    <h1 class="text-3xl mt-2">Halo, teman belajar!</h1>
    <p class="text-sm text-slate-500 mt-1 mb-6">Masukkan PIN 6 angka dari Kak Riki ya</p>
    <form @submit.prevent="handleLogin" class="space-y-4">
      <input type="text" maxlength="6" x-model="pinInput" placeholder="• • • • • •" inputmode="numeric" autocomplete="off" aria-label="PIN siswa" class="inp text-center text-3xl tracking-[.3em] font-mono py-4">
      <div x-show="loginError" x-cloak class="shake bg-rose-50 text-rose-600 text-sm p-3 rounded-2xl" x-text="loginError"></div>
      <button type="submit" class="btn btn-lg">Ayo mulai belajar!</button>
    </form>
    <button @click="openAdminModal = true" class="mt-6 text-sm text-sky-600 hover:underline">Masuk sebagai pengajar</button>
  </div>
</div>
</template>

<!-- ============ 2. STUDENT ============ -->
<template x-if="session.loggedIn && session.role === 'student'">
<div class="min-h-screen pb-24">
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur px-4 py-3 flex items-center justify-between" style="box-shadow:0 4px 0 var(--edge)">
    <div class="fd text-xl flex items-center gap-2"><span class="w-10" x-html="mascot"></span><span class="hidden sm:inline">Bimbel Kak Riki</span></div>
    <div class="flex items-center gap-2">
      <span class="pill" :class="xpBump && 'bump'">⭐ <span x-text="xp"></span> XP</span>
      <span class="pill hidden sm:inline-flex" x-text="session.name"></span>
      <button @click="logout()" class="btn btn-ghost btn-sm">Keluar</button>
    </div>
  </header>

  <!-- Peta belajar -->
  <template x-if="!activeLesson">
  <main class="max-w-xl mx-auto px-4 pt-6 pop">
    <div class="clay p-5 flex items-center gap-4">
      <div class="w-24 shrink-0" x-html="mascot"></div>
      <div class="flex-1">
        <h2 class="text-2xl" x-text="'Hai, ' + session.name.split(' ')[0] + '!'"></h2>
        <p class="text-sm text-slate-500" x-text="'Kelas ' + session.kelas + ' • ' + doneCount + ' dari ' + pathItems.length + ' misi selesai'"></p>
        <div class="bar mt-3"><div class="fill" :style="'width:' + (pathItems.length ? doneCount / pathItems.length * 100 : 0) + '%'"></div></div>
      </div>
    </div>

    <div x-show="!pathItems.length" class="text-center text-slate-500 mt-12">Belum ada misi. Tunggu Kak Riki menambahkannya ya! 🌱</div>

    <div class="flex flex-col items-center mt-16 pb-10">
      <template x-for="(it, i) in pathItems" :key="it.type + it.id">
        <div class="flex flex-col items-center mb-10" :style="'transform:translateX(' + [0, 50, 0, -50][i % 4] + 'px)'">
          <div class="relative">
            <div class="start" x-show="nextItem && nextItem.type === it.type && nextItem.id === it.id">Mulai di sini!</div>
            <button class="node" :class="[nodeColor(it), isDone(it) && 'is-done']" :aria-label="it.judul" @click="selectLesson(it, it.type)">
              <span x-text="nodeIcon(it)"></span>
              <b class="tick" x-show="isDone(it)">✓</b>
            </button>
          </div>
          <div class="mt-4 text-center text-sm max-w-[11rem] fd" x-text="it.judul"></div>
          <div class="text-xs text-slate-400" x-text="it.type === 'quiz' ? it.soal.length + ' soal seru' : tipeLabel(it)"></div>
        </div>
      </template>
    </div>
  </main>
  </template>

  <!-- Materi -->
  <template x-if="activeLesson && activeLesson.type === 'materi'">
  <main class="max-w-3xl mx-auto px-4 pt-6 pop">
    <button @click="closeLesson()" class="btn btn-ghost btn-sm mb-4">← Kembali ke peta</button>
    <div class="clay p-4 sm:p-6">
      <template x-if="activeLesson.tipe === 'youtube'">
        <div class="aspect-video rounded-3xl overflow-hidden bg-slate-900" style="box-shadow:inset 0 6px 14px rgba(0,0,0,.4)">
          <iframe :src="convertToEmbed(activeLesson.url)" class="w-full h-full" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </template>
      <template x-if="activeLesson.tipe === 'gambar'">
        <div class="rounded-3xl bg-sky-50 p-2 flex justify-center"><img :src="imageUrl(activeLesson.url)" :alt="activeLesson.judul" class="max-h-[70vh] w-auto rounded-2xl object-contain"></div>
      </template>
      <template x-if="activeLesson.tipe === 'html'">
        <div class="relative h-[70vh] rounded-3xl overflow-hidden bg-white" style="border:4px solid #D7ECF9">
          <div x-show="htmlLoading" class="absolute inset-0 grid place-items-center bg-white"><div class="dots"><i style="background:var(--g)"></i><i style="background:var(--b)"></i><i style="background:var(--y)"></i></div></div>
          <iframe sandbox="allow-scripts allow-forms allow-popups" :src="htmlSrc || null" :srcdoc="htmlDoc || null" :title="activeLesson.judul" class="w-full h-full"></iframe>
        </div>
      </template>
      <template x-if="isDocTipe(activeLesson.tipe)">
        <div class="h-[70vh] rounded-3xl overflow-hidden bg-slate-100" style="border:4px solid #D7ECF9"><iframe :src="previewUrl(activeLesson.url)" :title="activeLesson.judul" class="w-full h-full" allow="autoplay"></iframe></div>
      </template>
      <h2 class="text-2xl mt-5" x-text="activeLesson.judul"></h2>
      <p class="text-slate-500 text-sm mt-1" x-text="activeLesson.deskripsi || 'Materi pembelajaran kurikulum utama.'"></p>
      <div class="flex flex-wrap gap-3 mt-5">
        <button class="btn" @click="finishMateri()" x-text="isDone(activeLesson) ? 'Sudah selesai ✓' : 'Aku sudah paham! +10 XP'"></button>
        <a x-show="activeLesson.tipe === 'youtube'" :href="activeLesson.url" target="_blank" rel="noopener" class="btn btn-ghost">Buka di YouTube</a>
        <a x-show="activeLesson.tipe !== 'youtube' && activeLesson.tipe !== 'html'" :href="activeLesson.tipe === 'gambar' ? imageUrl(activeLesson.url) : activeLesson.url" target="_blank" rel="noopener" class="btn btn-ghost">Buka di tab baru</a>
      </div>
    </div>
  </main>
  </template>

  <!-- Quiz -->
  <template x-if="activeLesson && activeLesson.type === 'quiz'">
  <div class="fixed inset-0 z-40 bg-[var(--bg)] flex flex-col">
    <template x-if="!quizResult">
    <div class="flex flex-col h-full">
      <div class="px-4 py-4 flex items-center gap-3 max-w-2xl w-full mx-auto">
        <button class="btn btn-ghost btn-sm" @click="closeLesson()" aria-label="Keluar dari kuis">✕</button>
        <div class="bar flex-1"><div class="fill" :style="'width:' + ((quizStep + (checked ? 1 : 0)) / activeLesson.soal.length * 100) + '%'"></div></div>
        <span x-show="combo > 1" class="pop fd text-orange-500 text-lg" x-text="'🔥 ' + combo"></span>
      </div>
      <div class="flex-1 overflow-y-auto px-4 pb-56">
        <template x-for="n in [quizStep]" :key="n">
        <div class="max-w-2xl mx-auto">
          <p class="text-sm text-slate-400 mt-2" x-text="'Soal ' + (quizStep + 1) + ' dari ' + activeLesson.soal.length"></p>
          <h2 class="text-2xl sm:text-3xl mb-5" x-text="current.tanya"></h2>
          <template x-if="current.img"><div class="clay-sm p-2 mb-5 flex justify-center"><img :src="current.img" class="max-h-60 object-contain rounded-2xl" alt=""></div></template>
          <div class="space-y-4">
            <template x-for="(opt, k, oi) in current.opsi" :key="k">
              <button class="opt" :style="'animation-delay:' + (oi * 70) + 'ms'" :disabled="checked" @click="pick(k)"
                :class="checked ? (k === current.kunci ? 'right' : (picked === k ? 'wrong' : 'dim')) : (picked === k ? 'sel' : '')">
                <span class="k" x-text="k.toUpperCase()"></span><span x-text="opt"></span>
              </button>
            </template>
          </div>
        </div>
        </template>
      </div>
      <div class="sheet" :class="!checked ? 'idle' : (isCorrect ? 'ok' : 'no')">
        <div class="max-w-2xl mx-auto px-4 py-5 flex items-center gap-4">
          <div x-show="checked" class="slide-up flex items-center gap-3 flex-1 min-w-0">
            <span class="text-4xl" x-text="isCorrect ? '🎉' : '🤔'"></span>
            <div class="min-w-0"><div class="fd text-xl" x-text="isCorrect ? 'Hebat sekali!' : 'Hampir benar!'"></div>
              <div x-show="!isCorrect" class="text-sm" x-text="'Jawaban benar: ' + current.kunci.toUpperCase() + '. ' + current.opsi[current.kunci]"></div></div>
          </div>
          <button x-show="!checked" class="btn ml-auto" :disabled="!picked" @click="checkAnswer()">Periksa</button>
          <button x-show="checked" class="btn" :class="isCorrect ? '' : 'btn-red'" @click="nextQuestion()" x-text="quizStep < activeLesson.soal.length - 1 ? 'Lanjut' : 'Selesai'"></button>
        </div>
      </div>
    </div>
    </template>

    <template x-if="quizResult">
    <div class="flex-1 flex items-center justify-center px-4 overflow-y-auto">
      <div class="clay max-w-md w-full p-8 text-center pop" :class="quizResult.score >= 60 ? 'happy-jump' : 'sad'">
        <div class="w-32 mx-auto" x-html="mascot"></div>
        <h2 class="text-3xl mt-2" x-text="quizResult.score >= 60 ? 'Kamu keren banget!' : 'Ayo coba lagi!'"></h2>
        <div class="flex justify-center my-2"><template x-for="n in [1,2,3]"><span class="star" :class="n <= quizResult.stars && 'on'" :style="'--d:' + (n * 250) + 'ms'">⭐</span></template></div>
        <p class="fd text-5xl" style="color:var(--g)" x-text="quizResult.score"></p>
        <p class="text-slate-500 mt-1" x-text="quizResult.correct + ' dari ' + quizResult.total + ' benar  •  +' + quizResult.gained + ' XP' + (quizResult.gained === 0 ? ' (skor terbaikmu sudah tersimpan)' : '')"></p>

    <script>

        let _ac;
        const SESSION_KEY = 'bimbel_session_v1', SESSION_TTL = 8 * 60 * 60 * 1000;
        let sessionExp = 0;
                function bimbelApp() {
            return {
                apiUrl: 'https://script.google.com/macros/s/AKfycbz_GqDLroOxzbtr3CL5at1V9lm0-4MBNDscp7DEhep8r0L8UzaY2S65mTLSppQV9mDs/exec',
                loading: false,
                toast: { show: false, message: '', timer: null },
                session: { loggedIn: false, role: '', id: '', name: '', kelas: '' },
                pinInput: '',
                loginError: '',
                adminTab: 'eksekutif',
                openAdminModal: false,
                adminEmailInput: '',
                adminPassInput: '',
                adminLoginError: '',
                activeLesson: null,
                quizAnswers: {},
                mascot: MASCOT, xp: 0, xpBump: false, done: {},
                quizStep: 0, picked: '', checked: false, isCorrect: false, quizResult: null, combo: 0,

                get pathItems() { return [...this.materiList.map(m => ({ ...m, type: 'materi' })), ...this.quizList.map(q => ({ ...q, type: 'quiz' }))]; },
                get doneCount() { return this.pathItems.filter(i => this.isDone(i)).length; },
                get nextItem() { return this.pathItems.find(i => !this.isDone(i)); },
                get current() { return this.activeLesson && this.activeLesson.soal ? this.activeLesson.soal[this.quizStep] : null; },
                nodeColor(it) { return it.type === 'quiz' ? 'n-purple' : ({ youtube: 'n-green', gambar: 'n-orange', html: 'n-orange' }[it.tipe] || 'n-blue'); },
                nodeIcon(it) { return it.type === 'quiz' ? '⭐' : ({ youtube: '🎬', gambar: '🖼️', html: '🧩' }[it.tipe] || '📄'); },
                tipeLabel(it) { return { youtube: 'Video', pdf: 'PDF', gambar: 'Gambar', html: 'Halaman interaktif' }[it.tipe] || 'Dokumen'; },
                isDocTipe(t) { return !['youtube', 'gambar', 'html'].includes(t); },
                driveId(url) { const m = (url || '').match(/\/d\/([\w-]{15,})|[?&]id=([\w-]{15,})/); return m ? (m[1] || m[2]) : ''; },
                previewUrl(url) {
                    if (!url) return '';
                    const g = url.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]+)/);
                    if (g) return `https://docs.google.com/${g[1]}/d/${g[2]}/${g[1] === 'presentation' ? 'embed' : 'preview'}`;
                    const id = this.driveId(url);

                },
                imageUrl(url) {
                    if (!url || /googleusercontent\.com/.test(url)) return url;

                },
                async loadHtmlMateri(item) {
                    const id = this.driveId(item.url);

                    const res = await this.postToBackend({ action: 'getHtml', fileId: id }, true);
                    if (this.activeLesson && this.activeLesson.id === item.id) {
                        this.htmlDoc = (res && res.status === 'success') ? res.html : '<p style="font-family:sans-serif;padding:24px">Materi belum bisa dimuat. Coba lagi ya.</p>';
                        this.htmlLoading = false;
                    }
                },
                itemKey(it) { return it.type === 'quiz' ? 'quiz:' + it.judul : 'materi:' + it.id; },
                isDone(it) { return this.done[this.itemKey(it)] !== undefined; },
                persist() {
                    try {
                        if (!this.session.loggedIn) { localStorage.removeItem(SESSION_KEY); return; }
                        localStorage.setItem(SESSION_KEY, JSON.stringify({ ...this.session, xp: this.xp, done: this.done, exp: sessionExp }));
                    } catch (e) {}
                },
                startSession(info, prog) {
                    this.session = { loggedIn: true, role: info.role, id: info.id || '', name: info.name, kelas: info.kelas };
                    this.xp = prog ? (prog.total || 0) : 0;
                    this.done = prog ? (prog.progres || {}) : {};
                    sessionExp = Date.now() + SESSION_TTL;
                    this.persist();
                },
                async refreshStudent() {
                    const res = await this.postToBackend({ action: 'restoreSession', id: this.session.id }, true);
                    if (res && res.status === 'success') {
                        this.session.name = res.name; this.session.kelas = res.kelas;
                        this.xp = res.total || 0; this.done = res.progres || {};

                    }
                },
                checkExpiry() {
                    if (this.session.loggedIn && sessionExp && Date.now() > sessionExp) {
                        this.logout();
                        this.notify('Sesi 8 jam habis. Masuk lagi ya!');
                    }
                },
                addXp(n) { this.xp += n; this.xpBump = true; setTimeout(() => this.xpBump = false, 500); this.persist(); },
                closeLesson() { this.activeLesson = null; this.quizResult = null; },
                async finishMateri() {
                    const it = this.activeLesson, k = this.itemKey(it);
                    if (this.done[k] !== undefined) { this.closeLesson(); return; }
                    this.done[k] = 10; this.addXp(10); this.confetti(36); this.sfx('ok');
                    this.notify('Mantap! Kamu dapat +10 XP');
                    this.closeLesson();
                    if (this.apiUrl && this.session.id) {
                        const res = await this.postToBackend({ action: 'completeMateri', id: this.session.id, materiId: it.id }, true);
                        if (res && res.status === 'success') { this.xp = res.total; this.done = res.progres; this.persist(); }
                    }
                },

                pick(k) { if (this.checked) return; this.picked = k; this.quizAnswers[this.quizStep] = k; },
                checkAnswer() {
                    if (!this.picked || this.checked) return;
                    this.isCorrect = this.picked === this.current.kunci;
                    this.checked = true;
                    if (this.isCorrect) { this.combo++; this.sfx('ok'); this.confetti(18); } else { this.combo = 0; this.sfx('no'); }
                },
                async nextQuestion() {
                    if (this.quizStep < this.activeLesson.soal.length - 1) { this.quizStep++; this.picked = ''; this.checked = false; }
                    else { await this.submitQuiz(); }
                },
                confetti(n = 30) {
                    const cols = ['#58CC02', '#1CB0F6', '#FFC800', '#FF4B4B', '#CE82FF', '#FF9600'];
                    for (let i = 0; i < n; i++) {
                        const e = document.createElement('i'); e.className = 'cf';
                        e.style.cssText = `left:${50 + (Math.random() - .5) * 30}vw;background:${cols[i % 6]};--dx:${(Math.random() - .5) * 90}vw;--r:${Math.random() * 720}deg;animation-delay:${Math.random() * .15}s`;
                        document.body.appendChild(e); setTimeout(() => e.remove(), 1900);
                    }
                },
                sfx(t) {
                    try {
                        _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
                        (t === 'ok' ? [523, 784] : [220, 165]).forEach((f, i) => {
                            const o = _ac.createOscillator(), g = _ac.createGain(), s = _ac.currentTime + i * .12;
                            o.type = t === 'ok' ? 'triangle' : 'sawtooth'; o.frequency.value = f;
                            g.gain.setValueAtTime(.1, s); g.gain.exponentialRampToValueAtTime(.001, s + .2);
                            o.connect(g); g.connect(_ac.destination); o.start(s); o.stop(s + .22);
                        });
                    } catch (e) {}
                },

                materiList: [
                    { id: 1, judul: 'Strategi Kilat Turunan & Integral', tipe: 'youtube', url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', kelas: '12-IPA', deskripsi: 'Paham konsep turunan dalam 10 menit tanpa pusing.' },
                    { id: 2, judul: 'Ringkasan Rumus Cepat Fisika UTBK', tipe: 'pdf', url: 'https://drive.google.com', kelas: '12-IPA', deskripsi: 'Modul praktis rumus fisika terlengkap.' }
                ],
                quizList: [
                    { 
                        id: 1, 
                        judul: 'Latihan Ulangan Harian Turunan', 
                        soal: [
                            { tanya: 'Berapa turunan dari f(x) = 3x^2?', img: '', opsi: { a: '3x', b: '6x', c: '9x', d: 'x^2' }, kunci: 'b' },
                            { tanya: 'Jika f(x) = 5, maka f\'(x) adalah...', img: '', opsi: { a: '5', b: '1', c: '0', d: 'x' }, kunci: 'c' }
                        ]
                    }
                ],
                rekapList: [
                    { nama: 'Budi Santoso', kelas: '12-IPA', quizJudul: 'Latihan Aljabar Dasar', skor: 85, timestamp: '17 Nov 2026, 14:20' }
                ],
                studentsList: [
                    { id: 1, name: 'Budi Santoso', kelas: '12-IPA', pin: '849201' },
                    { id: 2, name: 'Siti Aminah', kelas: '12-IPA', pin: '392011' }
                ],
                newStudent: { name: '', kelas: '' },
                newMateri: { judul: '', kelas: '', tipe: 'youtube', url: '', deskripsi: '', fileName: '', fileData: '' },
                htmlDoc: '', htmlSrc: '', htmlLoading: false,
                newSoal: { quizJudul: 'Latihan Ulangan Harian Turunan', tanya: '', img: '', a: '', b: '', c: '', d: '', kunci: 'a' },

                initApp() {
                    let saved = null;
                    try { saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) {}
                    if (saved && saved.loggedIn && saved.exp > Date.now()) {
                        this.session = { loggedIn: true, role: saved.role, id: saved.id || '', name: saved.name, kelas: saved.kelas };
                        this.xp = saved.xp || 0; this.done = saved.done || {};
                        sessionExp = saved.exp;
                        if (saved.role === 'student' && this.apiUrl && saved.id) this.refreshStudent();

                    if (this.apiUrl) this.fetchLiveData(true);

                },

                async fetchLiveData(silent = false) {
                    if (!this.apiUrl) return;
                    this.loading = true;
                    try {
                        const res = await fetch(this.apiUrl);

                        if (data.status === 'success') {
                            if (data.siswa && data.siswa.length) this.studentsList = data.siswa;

                            if (data.quiz && data.quiz.length) this.quizList = data.quiz;

                        }
                    } catch (err) {
                        console.error(err);
                        if (!silent) this.notify('Gagal terhubung ke Live Sheets. Menggunakan mode cache.');
                    } finally {
                        this.loading = false;

                async postToBackend(payload, silent = false) {
                    if (!this.apiUrl) return null;

                        const res = await fetch(this.apiUrl, {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                        return await res.json();
                    } catch (err) {
                        console.error(err);
                        return null;
                    } finally {
                        if (!silent) this.loading = false;

                    this.toast.timer = setTimeout(() => { this.toast.show = false; }, 3500);
                },

                fallbackCopy(text) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    try { document.execCommand('copy'); } catch (e) {}
                    document.body.removeChild(textarea);
                },

                async handleLogin() {
                    this.loginError = '';
                    const cleanPin = this.pinInput.trim().toUpperCase();

                    if (this.apiUrl) {
                        const res = await this.postToBackend({ action: 'login', pin: cleanPin });
                        if (res && res.status === 'success') {
                            this.startSession({ role: 'student', id: res.id, name: res.name, kelas: res.kelas }, res);
                            
                            return;
                        } else if (res && res.message) {
                            this.loginError = res.message;
                            return;
                        }
                    }

                    const found = this.studentsList.find(s => s.pin === cleanPin);
                    if (found) {
                        this.startSession({ role: 'student', id: found.id, name: found.name, kelas: found.kelas }, null);
                        
                    } else {
                        this.loginError = 'PIN tidak terdaftar. Hubungi admin bimbel Anda.';
                    }
                },

                async handleAdminLogin() {
                    this.adminLoginError = '';
                    if (!this.apiUrl) {
                        this.adminLoginError = 'Endpoint backend belum terkonfigurasi.';
                        return;
                    }

                    const res = await this.postToBackend({
                        action: 'loginAdmin',
                        email: this.adminEmailInput,
                        password: this.adminPassInput
                    });

                    if (res && res.status === 'success') {
                        this.startSession({ role: 'admin', name: res.name || 'Owner / Instructor', kelas: 'All' }, null);
                        this.openAdminModal = false;
                        this.adminEmailInput = '';
                        this.adminPassInput = '';
                        this.fetchLiveData();
                    } else {
                        this.adminLoginError = (res && res.message) ? res.message : 'Email atau password admin salah.';
                    }
                },

                logout() {
                    this.session = { loggedIn: false, role: '', id: '', name: '', kelas: '' };
                    sessionExp = 0; this.persist();
                    this.pinInput = '';
                    this.activeLesson = null; this.quizResult = null; this.xp = 0; this.done = {};
                },

                selectLesson(item, type) {
                    this.activeLesson = { ...item, type };
                    this.quizAnswers = {};
                    this.quizStep = 0; this.picked = ''; this.checked = false; this.isCorrect = false; this.quizResult = null; this.combo = 0;
                    this.htmlDoc = ''; this.htmlSrc = ''; this.htmlLoading = false;
                    if (type === 'materi' && item.tipe === 'html') this.loadHtmlMateri(item);
                },

                convertToEmbed(url) {
                    if (!url) return '';
                    let videoId = '';
                    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
                    const match = url.match(regExp);
                    if (match && match[2].length === 11) {
                        videoId = match[2];
                    }
                    return videoId ? `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1` : url;
                },

                async submitQuiz() {
                    const lesson = this.activeLesson, total = lesson.soal.length;
                    let correctCount = 0;
                    lesson.soal.forEach((q, idx) => { if (this.quizAnswers[idx] === q.kunci) correctCount++; });
                    const finalScore = Math.round((correctCount / total) * 100);

                    // XP dihitung lokal dulu (instan), lalu disamakan dengan server
                    const k = this.itemKey({ type: 'quiz', judul: lesson.judul });
                    const prev = this.done[k] || 0, xpNow = correctCount * 10, gained = Math.max(0, xpNow - prev);
                    this.done[k] = Math.max(prev, xpNow);

                    this.rekapList.unshift({
                        id: Date.now(), nama: this.session.name, kelas: this.session.kelas,
                        quizJudul: lesson.judul, skor: finalScore, timestamp: new Date().toLocaleString('id-ID')
                    });
                    this.quizResult = { score: finalScore, correct: correctCount, total, gained, stars: finalScore >= 90 ? 3 : finalScore >= 60 ? 2 : 1 };
                    this.addXp(gained);
                    if (finalScore >= 60) { this.confetti(70); this.sfx('ok'); }

                    if (this.apiUrl) {
                        const res = await this.postToBackend({
                            action: 'submitQuiz', id: this.session.id, nama: this.session.name, kelas: this.session.kelas,
                            quizJudul: lesson.judul, skor: finalScore, benar: correctCount
                        }, true);
                        if (res && res.status === 'success' && res.total !== undefined) { this.xp = res.total; this.done = res.progres; this.persist(); }
                    }
                },

                async addStudent() {
                    const randomPin = Math.floor(100000 + Math.random() * 900000).toString();
                    const payload = {
                        action: 'addSiswa',
                        name: this.newStudent.name,
                        kelas: this.newStudent.kelas,
                        pin: randomPin
                    };

                    if (this.apiUrl) {
                        const res = await this.postToBackend(payload);
                        if (res && res.pin) payload.pin = res.pin;
                    }

                    this.studentsList.push({ id: Date.now(), name: payload.name, kelas: payload.kelas, pin: payload.pin });
                    this.newStudent = { name: '', kelas: '' };
                    this.notify(`Siswa ditambahkan! PIN unik: ${payload.pin}`);
                },

                async addMateri() {
                    const payload = {
                        action: 'addMateri',
                        judul: this.newMateri.judul,
                        kelas: this.newMateri.kelas,
                        tipe: this.newMateri.tipe,
                        url: this.newMateri.fileData || this.newMateri.url,
                        fileName: this.newMateri.fileName,
                        deskripsi: this.newMateri.deskripsi || 'Materi pembelajaran baru.'
                    };
                    let newId = Date.now();

                    if (this.apiUrl) {
                        const res = await this.postToBackend(payload);
                        if (res && res.status === 'error') { this.notify(res.message || 'Gagal menerbitkan materi.'); return; }
                        if (res && res.url) payload.url = res.url;
                        if (res && res.id) newId = res.id;
                    }

                    const { action, ...item } = payload;
                    this.materiList.push({ id: newId, ...item });
                    this.newMateri = { judul: '', kelas: '', tipe: 'youtube', url: '', deskripsi: '', fileName: '', fileData: '' };
                    this.notify('Materi berhasil diterbitkan & tersimpan di Google Drive!');
                },

                async addSoal() {
                    const payload = {
                        action: 'addSoal',
                        ...this.newSoal
                    };

                    let finalImg = this.newSoal.img;
                    if (this.apiUrl) {
                        const res = await this.postToBackend(payload);
                        if (res && res.imgUrl) finalImg = res.imgUrl;
                    }

                    let targetQuiz = this.quizList.find(q => q.judul.toLowerCase() === this.newSoal.quizJudul.toLowerCase());
                    const soalObj = {
                        tanya: this.newSoal.tanya,
                        img: finalImg,
                        opsi: { a: this.newSoal.a, b: this.newSoal.b, c: this.newSoal.c, d: this.newSoal.d },
                        kunci: this.newSoal.kunci
                    };

                    if (targetQuiz) {
                        targetQuiz.soal.push(soalObj);
                    } else {
                        this.quizList.push({ id: Date.now(), judul: this.newSoal.quizJudul, soal: [soalObj] });
                    }

                    this.newSoal.tanya = '';
                    this.newSoal.img = '';
                    this.newSoal.a = ''; this.newSoal.b = ''; this.newSoal.c = ''; this.newSoal.d = '';
                    this.notify('Soal berhasil ditambahkan ke bank quiz!');
                },

                loadMateriFile(file) {
                    if (!file) return;
                    if (file.size > 10 * 1024 * 1024) { this.notify('File terlalu besar, maksimal 10MB.'); return; }
                    const ext = (file.name.split('.').pop() || '').toLowerCase();
                    this.newMateri.tipe = ext === 'pdf' ? 'pdf' : (['html', 'htm'].includes(ext) ? 'html' : (file.type.startsWith('image/') ? 'gambar' : 'dokumen'));
                    this.newMateri.fileName = file.name;
                    this.newMateri.url = '';
                    const reader = new FileReader();
                    reader.onload = (ev) => { this.newMateri.fileData = ev.target.result; this.notify(`File ${file.name} siap diterbitkan.`); };
                    reader.readAsDataURL(file);
                },

                handleMaterialFileDrop(e) { this.loadMateriFile(e.dataTransfer.files[0]); },
                handleMaterialFilePick(e) { this.loadMateriFile(e.target.files[0]); e.target.value = ''; },

                handleQuizImageDrop(e) {
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        const file = files[0];
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            this.newSoal.img = event.target.result;
                            this.notify('Gambar soal berhasil di-upload.');
                        };
                        reader.readAsDataURL(file);
                    }
                },

                copyPin(pin, name) {
                    const msg = `Halo ${name}! Berikut akses Portal Belajar Bimbel Anda:\nPIN Login: *${pin}*\nSilakan masuk melalui portal.`;
                    this.fallbackCopy(msg);
                    this.notify(`Pesan undangan & PIN ${pin} berhasil disalin!`);
                },

                exportCSV() {
                    let csvContent = "Nama Siswa,Kelas,Nama Quiz,Skor,Waktu Submit\n";
                    this.rekapList.forEach(r => {
                        csvContent += `"${r.nama}","${r.kelas}","${r.quizJudul}",${r.skor},"${r.timestamp}"\n`;
                    });
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = "Rekap_Nilai_Bimbel.csv";
                    link.click();
                    this.notify('File Rekap_Nilai_Bimbel.csv berhasil diunduh.');
                }
            }
        }
    </script>
